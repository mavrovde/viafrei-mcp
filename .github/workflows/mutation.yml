# Mutation testing of the server (StrykerJS, vitest runner; server/stryker.config.mjs,
# server/scripts/mutation.mjs).
#
# Once per release, never per pull request or push (owner 2026-11-18, as in
# viafrei-api, viafrei-database and viafrei-web): publish.yml (the npm workflow)
# calls this workflow on the tagged commit, and its publish job needs it next to
# Snyk, so a red run stops the publish. A manual run does the same on the chosen
# ref. It is the full run over every in-scope file, failing below 70 %; the
# report lists the counts per file and every mutant not detected.
#
# The full run is cut into four parallel shards, as everywhere: Mutation shard k
# mutates the in-scope files at the positions p of the sorted scope with
# p mod 4 = k - 1 (mutation.mjs shard k/4; the four are disjoint, together every
# file and none empty, scripts/mutation-workflow.test.mjs), and the Mutation
# testing job gathers their reports into one gate, which refuses a file with no
# report or two. Mutation testing is green only when every shard finished green.
name: Mutation

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to mutate (the release's tagged commit)
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  # The four shards of the scope, printed once; exit 2 (red) on an empty shard.
  plan:
    name: Mutation plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: The shards of the full run
        working-directory: server
        run: node scripts/mutation.mjs plan 4

  # One shard of the full run each, with no floor of its own; fail-fast is off,
  # so one run reports every failing shard. Exit 2 (red) on an empty shard or a
  # bad K/N.
  shards:
    name: Mutation shard
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The files of the shard
        working-directory: server
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/mutation.mjs shard "$SHARD/4" "$GITHUB_WORKSPACE/mutation-shard"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: mutation-shard/
          if-no-files-found: error
          retention-days: 7

  # The gate: the fan-in of the shards. It runs unless the run was cancelled, so
  # a shard that failed, timed out or never started (failure, cancelled or
  # skipped, never success) fails the run before any report is read.
  mutation:
    name: Mutation testing
    needs: [plan, shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Every shard finished with its reports
        env:
          SHARDS: ${{ needs.shards.result }}
        run: |
          [[ $SHARDS == success ]] || { echo "::error::the mutation shards ended '$SHARDS', not success: a shard that failed, refused or did not finish (see the Mutation shard jobs)"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: mutation-shards
      - name: Mutation testing
        working-directory: server
        run: node scripts/mutation.mjs gather "$GITHUB_WORKSPACE/mutation-shards" "$GITHUB_WORKSPACE/mutation-report.md"
      - name: Report in the job summary
        if: always()
        run: if [[ -f mutation-report.md ]]; then cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: |
            mutation-report.md
            mutation-shards/
          if-no-files-found: ignore
          retention-days: 30
