name: Image

# The server's container image: ghcr.io/mavrovde/viafrei-mcp:<version>, built
# from server/Dockerfile for linux/amd64 and linux/arm64. The order is the
# point, and scripts/image-workflow.test.mjs holds it:
#
#   1. gate: the run is on an annotated vX.Y.Z tag on main that equals both
#      package.json versions, and CI passed on that commit (scripts/ci-gate.mjs);
#   2. server: the server's typecheck, unit and end-to-end tests (server.yml,
#      called on the same commit);
#   3. publish: a linux/amd64 build is scanned by Trivy, and a HIGH or CRITICAL
#      finding stops the release before anything is pushed; then the multi-arch
#      image is pushed BY DIGEST only, signed keyless with cosign, and its SLSA
#      provenance and SPDX SBOM attested;
#   4. verify: the digest is pulled, cosign verify passes with the certificate
#      identity pinned to THIS workflow on a release tag and to the gate's
#      commit, and the digest runs as uid 10001 with a read-only root file
#      system and answers /healthz (scripts/image-smoke.sh);
#   5. tag: only then do :X.Y.Z (and :X.Y, :latest when this is the newest)
#      point at the verified digest, each read back.
#
# Every action is pinned by its full commit SHA; every job ends within 15 min.
# Dispatched on the tag by publish.yml (the Release workflow) once its checks
# (Snyk, the full mutation run, the e2e against the real API) have passed and
# npm serves the version, so an image is never built for a release those
# checks stopped. Not started by the tag push itself: that would build beside
# the checks instead of after them. A dispatch by hand on a tag
# (gh workflow run image.yml --ref vX.Y.Z) is the recovery for a failed run.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mavrovde/viafrei-mcp
  TAG: ${{ github.ref_name }}
  # The host sits in a non-capturing group so the public-repo sweep reads a URL, not the
  # half host an escaped dot would leave; the expression matches the same strings.
  IDENTITY: ^https://(?:github\.com)/mavrovde/viafrei-mcp/\.github/workflows/image\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # CI's runs on the tagged commit
    outputs:
      version: ${{ steps.tag.outputs.version }}
      minor: ${{ steps.tag.outputs.minor }}
      commit: ${{ steps.tag.outputs.commit }}
      highest: ${{ steps.tag.outputs.highest }}
      highest_in_minor: ${{ steps.tag.outputs.highest_in_minor }}
    steps:
      - name: The run is on its tag
        run: |
          [[ $GITHUB_REF == "refs/tags/$TAG" ]] || { echo "::error::image gate: this run is on $GITHUB_REF, not on a tag; start it on the tag (gh workflow run image.yml --ref vX.Y.Z)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is an annotated vX.Y.Z equal to package.json, on main
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ $TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::$TAG is not a final vX.Y.Z tag; only a release publishes an image"; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]}
          version=${TAG#v}
          [[ $(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type) == tag ]] || { echo "::error::$TAG is a lightweight tag; a release needs an annotated tag (git tag -a)"; exit 1; }
          for f in package.json server/package.json; do
            pkg=$(jq -r .version "$f")
            [[ $pkg == "$version" ]] || { echo "::error::$TAG does not equal $f's version ($pkg)"; exit 1; }
          done
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG^{commit}" origin/main || { echo "::error::$TAG points at a commit that is not on main"; exit 1; }
          commit=$(git rev-parse "$TAG^{commit}")
          # The certificate records github.sha, so the tag and the run are one commit or nothing is built.
          [[ $commit == "$GITHUB_SHA" ]] || { echo "::error::$TAG points at $commit, but this run was started for $GITHUB_SHA"; exit 1; }
          {
            echo "version=$version"
            echo "minor=$major.$minor"
            echo "commit=$commit"
            echo "highest=$([[ $(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1) == "$TAG" ]] && echo true || echo false)"
            echo "highest_in_minor=$([[ $(git tag -l "v$major.$minor.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1) == "$TAG" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.tag.outputs.commit }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs?head_sha=$SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
          node scripts/ci-gate.mjs "$SHA" "$GH_REPO" < "$RUNNER_TEMP/runs.json"

  server:
    name: Server tests on the tagged commit
    needs: gate
    uses: ./.github/workflows/server.yml

  publish:
    name: Scan, push by digest, sign, attest
    needs: [gate, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the scan (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          load: true
          push: false
          tags: viafrei-mcp:release-check
          build-args: |
            VERSION=${{ needs.gate.outputs.version }}
            GIT_SHA=${{ needs.gate.outputs.commit }}
      - name: Trivy (HIGH and CRITICAL fail, before anything is pushed)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
            viafrei-mcp:release-check
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Not released yet (a release is never rebuilt or re-tagged)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: scripts/ghcr-not-released.sh "$IMAGE" "$VERSION"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          # By digest only: no tag exists until the verify job has passed (the tag job).
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.gate.outputs.version }}
            GIT_SHA=${{ needs.gate.outputs.commit }}
          labels: |
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
      - name: Attest the SBOM to the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$IMAGE@$DIGEST"
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed \`$IMAGE@$DIGEST\` (untagged until verified)" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the published digest
    needs: [gate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Pull by digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker pull "$IMAGE@$DIGEST"
      - name: cosign verify (this workflow, on a release tag, built from the gate's commit)
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: cosign verify "$IMAGE@$DIGEST" --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" --certificate-github-workflow-sha "$COMMIT" > /dev/null
      - name: gh attestation verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GH_REPO" --signer-workflow mavrovde/viafrei-mcp/.github/workflows/image.yml --source-ref "$GITHUB_REF" --source-digest "$COMMIT"
      - name: cosign verify-attestation (the SPDX SBOM, same identity)
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: cosign verify-attestation "$IMAGE@$DIGEST" --type spdxjson --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" --certificate-github-workflow-sha "$COMMIT" > /dev/null
      - name: Run the published digest (uid 10001, read-only root, /healthz)
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: IMAGE="$IMAGE_REF" scripts/image-smoke.sh

  tag:
    name: Tag the verified digest
    needs: [gate, publish, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Still not released (nothing tagged :X.Y.Z while this run built)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: scripts/ghcr-not-released.sh "$IMAGE" "$VERSION"
      - name: Point the tags at the digest and read each one back
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.gate.outputs.version }}
          MINOR: ${{ needs.gate.outputs.minor }}
          HIGHEST: ${{ needs.gate.outputs.highest }}
          HIGHEST_IN_MINOR: ${{ needs.gate.outputs.highest_in_minor }}
        run: |
          tags=("$IMAGE:$VERSION")
          # :X.Y moves to the newest patch of its minor only; :latest to the newest vX.Y.Z tag only.
          if [[ $HIGHEST_IN_MINOR == true ]]; then tags+=("$IMAGE:$MINOR"); fi
          if [[ $HIGHEST == true ]]; then tags+=("$IMAGE:latest"); fi
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for t in "${tags[@]}"; do
            got=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r .digest)
            [[ $got == "$DIGEST" ]] || { echo "::error::$t points at $got, not the verified $DIGEST"; exit 1; }
            echo "- \`$t\` → \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          done
