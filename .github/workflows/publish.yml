name: Release

# THE RELEASE of one tag vX.Y.Z, in viafrei-api's order (its release.yml):
# the checks that can fail run first, on the tagged commit, before anything is
# packed - Snyk, the full mutation run, the e2e against the real API - then
# the npm publish (CI passed on the commit, the publish-hygiene gate on the
# tarball, the upload, the read-back), then the image (image.yml, dispatched
# on the tag) and the release page (release-page.yml, called: release-please's
# draft is filled from the CHANGELOG and published). The MCP Registry and
# Smithery come later and not from here: they list the LIVE server, which
# serves the version only after the deploy outside this repository, so the
# daily Version sync dispatches them once it does.
#
# The FILE stays publish.yml (viafrei-api's is release.yml), because npm's
# trusted publisher is configured against the workflow's file name and a
# renamed file would be refused.

# Tag-driven publish to npm with provenance, via npm Trusted Publishing.
#
# There is no token and no OTP anywhere in this file, and there must never be
# one: the OIDC exchange is the credential. Configure the trusted publisher on
# the npm package as `mavrovde/viafrei-mcp` (renamed from viafrei-bridge on 2026-10-04) + `.github/workflows/publish.yml`
# before the first run.
#
# The publish-hygiene gate runs BEFORE the publish step, against the tarball
# that is about to be uploaded. The order is the point - a gate that runs after
# the upload is a report, not a gate, and npm versions are immutable.
#
# Started by release-please.yml's tag job, dispatched ON THE TAG with
# dry_run=false (a tag pushed with GITHUB_TOKEN starts no workflow run), or by
# a vX.Y.Z tag a maintainer pushes. Either way the ref is the tag and every
# gate below runs. A dispatch on a branch is the dry-run rehearsal and
# publishes nothing. Nothing here publishes from a branch.
#
# Snyk (snyk.yml, called by the snyk job below) tests the dependencies of the
# same commit first; the publish job needs it, so a high or critical advisory
# stops the release before anything is packed. The full mutation run of the
# server (mutation.yml, called by the mutation job below, 18 shards) tests it
# beside Snyk; publish needs it too, so a run below 70 % stops the release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # the CI gate reads the workflow runs of the tagged commit
  id-token: write # required for provenance and Trusted Publishing

env:
  # The npm CLI this pipeline publishes with. PINNED, and it stays pinned.
  #
  # This step used to install `npm@latest`, which made the outcome of a release
  # depend on the day it ran rather than on anything committed here. On
  # 2026-09-21 that bill came due: npm 12 was `latest`, and npm 12 changed
  # `npm pack --json` from an array to an object keyed by package name - a
  # deliberate major-version change, announced in npm's own source (npm 11's
  # lib/commands/pack.js: "XXX(BREAKING_CHANGE): publish outputs a json object
  # with package names as keys. Pack should do the same here instead of an
  # array"). The job broke with no commit in this repository.
  #
  # 12.0.2 is chosen because it is what `latest` resolves to today, so pinning
  # it changes nothing about the run except that tomorrow's run is the same as
  # today's; it has lib/utils/oidc.js and so can do Trusted Publishing; and its
  # `npm pack --json` shape is one of the two scripts/npm-pack-json.mjs reads.
  #
  # Before bumping this pin, in the same commit:
  #   1. run `npm run test:gate` against the new npm (install it into a temp
  #      prefix, do not change the machine's npm) - it proves the reader
  #      handles what that npm prints, and the reader refuses with one line if
  #      npm has invented a third shape;
  #   2. check the new npm still has lib/utils/oidc.js, i.e. it can still
  #      exchange a GitHub OIDC token for a publish credential without a token
  #      in this file;
  #   3. rehearse with the workflow_dispatch dry run before spending a tag.
  NPM_VERSION: '12.0.2'

jobs:
  # Snyk once per release, on the commit about to be packed and published
  # (snyk.yml; it also runs weekly on main, never on a pull request or a push).
  # A high or critical advisory stops the release before anything is built:
  # publish needs this job. Its own permissions replace the workflow-level
  # id-token grant, which only the publish job needs. It runs on a tag only;
  # a dispatch on a branch is the dry-run rehearsal, which publishes nothing.
  snyk:
    name: Snyk (dependencies)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/snyk.yml
    with:
      ref: ${{ github.sha }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # The full mutation run of the server once per release, on the commit about
  # to be published (mutation.yml, 18 shards gathered into one 70 % gate;
  # never on a pull request or a push). A red run stops the release: publish
  # needs this job. Like Snyk it runs on a tag only and needs no secret.
  mutation:
    name: Mutation
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/mutation.yml
    with:
      ref: ${{ github.sha }}

  # The MCP server against the REAL API before anything is published: the
  # viafrei-api release server/api.pin names (its published image), on the
  # database release that API release pins, seeded with the API repository's
  # synthetic fixture world (tiny profile). No live provider: the server calls
  # none, and the API's live refresher is not run. Same checks as the
  # mock run: initialize, tools/list byte-equal to catalogue.json, one
  # tools/call per tool. It fails, never skips, while the pinned API is not
  # published. If an image is private, the repo secret GHCR_READ_TOKEN
  # (packages: read) must hold a read token; without one the pull fails.
  server-e2e-api:
    name: Server e2e (real API)
    runs-on: ubuntu-24.04
    # Every job ends within 15 minutes (owner 2026-11-22): pulling two images,
    # migrating and seeding the tiny world and one call per tool fit in it.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the API pin
        id: pin
        run: |
          set -euo pipefail
          for k in api_repo api_image api_version fixture_profile; do
            v=$(sed -n "s/^${k}=//p" server/api.pin)
            [ -n "$v" ] || { echo "::error::server/api.pin has no ${k}"; exit 1; }
            echo "${k}=${v}" >> "$GITHUB_OUTPUT"
          done
      - name: Log in to GHCR (read)
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GHCR_READ_TOKEN}" ]; then
            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          fi
      - name: The pinned API release is published
        env:
          REF: ${{ steps.pin.outputs.api_image }}:${{ steps.pin.outputs.api_version }}
          VER: ${{ steps.pin.outputs.api_version }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "::error::API ${VER} not published yet (${REF} is not readable on GHCR). Publish waits for it."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.api_repo }}
          ref: v${{ steps.pin.outputs.api_version }}
          path: api
          token: ${{ secrets.GHCR_READ_TOKEN || github.token }}
      # Keyed operations need the API's access store, which its base compose leaves off:
      # compose.e2e.yaml (written here) pins the images, lets the role api_access log in
      # with this run's password (db-access, the way the API's own load stack does it) and
      # hands the API the access store and a pepper. Every secret is random per run.
      - name: Start the API on the database release it pins, with the fixture world and keyed access
        working-directory: api
        env:
          API_REF: ${{ steps.pin.outputs.api_image }}:${{ steps.pin.outputs.api_version }}
          PROFILE: ${{ steps.pin.outputs.fixture_profile }}
          API_PORT: '8080'
          API_HEALTH_PORT: '8082'
        run: |
          set -euo pipefail
          umask 077
          # database.pin opens with comment lines; the release is its first other line.
          db_image=$(awk '!/^#/ && NF { print; exit }' database.pin)
          case "$db_image" in
            *:*@sha256:*) ;;
            *) echo "::error::database.pin of the API release names no image pinned by digest"; exit 1 ;;
          esac
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "API_READER_PASSWORD=$(openssl rand -hex 24)"
            echo "API_ACCESS_PASSWORD=$(openssl rand -hex 24)"
            echo "VFAPI_AUTH_PEPPER=$(openssl rand -hex 32)"
            echo "FIXTURE_PROFILE=${PROFILE}"
            echo "API_PUBLISH=127.0.0.1:${API_PORT}"
            echo "API_HEALTH_PUBLISH=127.0.0.1:${API_HEALTH_PORT}"
            echo "E2E_DB_IMAGE=${db_image}"
            echo "E2E_API_IMAGE=${API_REF}"
          } > .env
          cat > compose.e2e.yaml <<'YAML'
          services:
            db-migrate: { image: "${E2E_DB_IMAGE:?}" }
            db-seed: { image: "${E2E_DB_IMAGE:?}" }
            db-access:
              extends: { file: compose.yaml, service: db-migrate }
              image: "${E2E_DB_IMAGE:?}"
              depends_on:
                db-migrate: { condition: service_completed_successfully }
              environment:
                API_ACCESS_PASSWORD: ${API_ACCESS_PASSWORD:?}
              command:
                - |
                  echo "alter role api_access login password :'pw';" | psql -X -q -v ON_ERROR_STOP=1 -v pw="$$API_ACCESS_PASSWORD" "$$DATABASE_URL"
            api:
              image: "${E2E_API_IMAGE:?}"
              pull_policy: always
              depends_on:
                db-access: { condition: service_completed_successfully }
              environment:
                VFAPI_ACCESS_URL: postgres://api_access:${API_ACCESS_PASSWORD:?}@db/test_contract?sslmode=disable
                VFAPI_AUTH_PEPPER: ${VFAPI_AUTH_PEPPER:?}
          YAML
          docker compose -f compose.yaml -f compose.e2e.yaml up -d --wait api || { docker compose -f compose.yaml -f compose.e2e.yaml logs --no-color | tail -200; exit 1; }
      # A key the way the API's scripts/load-test.sh issues one: a plan with every scope and
      # every signed-off source of the fixture world, then keys issue, whose second line is
      # the key. It is masked before it is written anywhere.
      - name: A key for the fixture world
        id: key
        working-directory: api
        run: |
          set -euo pipefail
          compose=(docker compose -f compose.yaml -f compose.e2e.yaml)
          sources=$("${compose[@]}" exec -T db psql -U owner -d test_contract -v ON_ERROR_STOP=1 -tAqc \
            "select string_agg(source_ref, ',' order by source_ref) from contract.source where review_signed_on is not null")
          [ -n "$sources" ] || { echo "::error::the fixture world has no signed-off source"; exit 1; }
          "${compose[@]}" exec -T api /app keys plan -name e2e -use-class commercial -tier standard \
            -scopes places,roads,energy,parking,transit,accessibility,weather,rules,history -sources "$sources" \
            -rate 100000 -burst 100000 -actor mcp-e2e > /dev/null
          key=$("${compose[@]}" exec -T api /app keys issue -plan e2e -label mcp-e2e -contact ops@example.test -actor mcp-e2e | sed -n 2p)
          [ -n "$key" ] || { echo "::error::the API's key tool issued no key"; exit 1; }
          echo "::add-mask::${key}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci --ignore-scripts
      - name: MCP over Streamable HTTP against the real API
        working-directory: server
        env:
          E2E_API_URL: http://127.0.0.1:8080
          E2E_API_KEY: ${{ steps.key.outputs.key }}
          E2E_FACTS: '1'
        run: npm run test:e2e:api
      - if: always()
        working-directory: api
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v || true

  publish:
    needs: [snyk, mutation, server-e2e-api]
    # After a passed scan and a passed mutation run, or a branch dry run with
    # neither; never past a failed or cancelled one, and never a real publish
    # without both.
    if: ${{ !cancelled() && (needs.snyk.result == 'success' || (needs.snyk.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.dry_run)) && (needs.mutation.result == 'success' || (needs.mutation.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.dry_run)) && (needs.server-e2e-api.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    # Pinned, unlike ci.yml: this is the job that mints a published
    # artefact, so the runner image it is built on is part of what is
    # being released. ubuntu-latest moves under us on GitHub's schedule.
    runs-on: ubuntu-24.04
    # Observed: a successful publish job is ~95 s. The same stall hit this workflow
    # for 15 minutes on 2026-09-28 (#25); with no timeout it would have run for six
    # hours with a tag already pushed and nothing published. Fifteen minutes is the
    # same ceiling as CI, for the same reason.
    timeout-minutes: 15
    # A deployment environment gives the owner a place to hang an approval on,
    # and npm can be told to require it. If the trusted publisher on npm is
    # configured WITHOUT an environment, delete this line - the two must agree,
    # or the OIDC claim will not match and the publish will be refused.
    #
    # WHAT IT GATES, AND WHY IT CARRIES NO PROTECTION RULE (#18). This environment is
    # the OIDC subject npm's trusted publisher is configured against, so it is part of
    # the credential: the claim must name it or the publish is refused. It has no
    # required reviewer DELIBERATELY - the release is already gated by a reviewer
    # verdict that must cover HEAD before the merge, and by every gate above this line
    # running against the exact tarball that is uploaded. A second approval here would
    # add a click, not a check. Recorded so "no rule needed" is distinguishable from
    # "nobody looked".
    environment: npm
    steps:
      # Pinned to a commit, not a tag: a tag is mutable and this workflow
      # publishes. ci.yml pins the same two shas, so there is one version of
      # each action in this repository rather than two.
      #
      # These were v4.4.0, held there deliberately because v4 was not the
      # newest major. That reason has EXPIRED rather than been overruled:
      # v4 runs on Node 20, which GitHub has deprecated and is already
      # forcing onto Node 24, so staying is no longer the conservative
      # choice. The CHANGELOG entry for this change lists all three majors
      # crossed per action and what each one does here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing needs a recent npm CLI; the one bundled with Node
      # may predate it. Which one is decided above, by NPM_VERSION, and the
      # install is ASSERTED rather than assumed: a pin nobody checks is a
      # comment, and this whole step exists because a version nobody checked
      # changed underneath a release.
      - name: Use the pinned npm that can do Trusted Publishing
        run: |
          set -eu
          npm install -g "npm@${NPM_VERSION}" --ignore-scripts
          installed="$(npm --version)"
          echo "npm ${installed} (pinned ${NPM_VERSION})"
          if [ "${installed}" != "${NPM_VERSION}" ]; then
            echo "Pinned npm ${NPM_VERSION} but npm --version says ${installed}." >&2
            exit 1
          fi

      # --ignore-scripts: no dependency's install hook runs in a job that can
      # build or publish this package. The gate refuses a lifecycle script in
      # OUR manifest; this is the same rule applied to everyone else's.
      - run: npm ci --ignore-scripts

      - name: The tag and the manifest must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest." >&2
            exit 1
          fi

      # The same assertion CI carries, repeated here as a belt: a tag can be pushed
      # without the branch ever having run CI (#18).
      - name: Manifest and lockfile versions agree
        run: npm run check:versions

      # CI passed on exactly this commit (viafrei-api REL-015). release-please's
      # tag job checked it before tagging; a tag a maintainer pushed was checked
      # by nothing until here. A run still going is red: re-run this job once CI
      # on the commit has finished.
      - name: CI passed on the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
          node scripts/ci-gate.mjs "$GITHUB_SHA" "$GH_REPO" < "$RUNNER_TEMP/runs.json"

      # A tag alone decides what gets published, so a tag pushed from ANY branch would
      # publish from it. This requires the tagged commit to be one `main` contains.
      # `fetch-depth: 0` above is what makes the ancestry answerable; without it this
      # would fail for the wrong reason, so the ref is fetched explicitly and its
      # absence is an error rather than a skip (#18).
      - name: The tagged commit must be contained in main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "origin/main could not be resolved, so containment cannot be checked" >&2
            exit 2
          fi
          echo "tag sha : ${GITHUB_SHA}"
          echo "main sha: $(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "The tagged commit is not contained in main - refusing to publish from it." >&2
            exit 1
          fi
          echo "OK: the tagged commit is contained in main."

      - name: Build
        run: npm run build

      - name: Offline tests
        run: npm test

      # --all-refs, unlike ci.yml: a branch build answers for its own history,
      # but the build that publishes answers for every ref -- this is the one
      # place where paying for that is obviously worth it.
      #
      # The cost is real and belongs here where somebody will meet it: an
      # unrelated branch carrying a finding CAN redden a tag push, and the
      # finding names a commit rather than a branch. `git branch -a --contains
      # <sha>` says which branch it is; delete or fix that branch and re-run.
      # Do not reach for removing --all-refs as the remedy -- for a published
      # artefact, a finding anywhere is worth stopping for.
      # SOURCES.md ships in the tarball and states counts about the server; this is the
      # offline half of keeping it honest (#32). Here as well as in CI because the thing
      # being published is what matters.
      - name: Sources page agrees with the catalogue snapshot
        run: npm run check:sources

      - name: Repository leak sweep
        run: node scripts/check-leaks.mjs --history --all-refs

      - name: Leak-sweep scope self-test
        run: npm run test:leaks

      - name: Publish-hygiene gate self-test
        run: npm run test:gate

      # Packed ONCE, here, and that exact file is what the gate reads and what
      # npm uploads. `npm run check:tarball` used to pack its own copy and
      # `npm publish` then packed another, so the artefact that was checked
      # was never the artefact that shipped - two builds of the same tree,
      # believed identical. They almost always are; "almost" is the whole
      # reason this gate exists.
      - name: Pack the tarball
        id: pack
        #
        # The filename comes out of scripts/npm-pack-json.mjs, which is the one
        # reader for `npm pack --json` in this repository. It used to be an
        # inline `JSON.parse(s)[0].filename` here and a second hand-rolled
        # parse in each of the two gates - three copies of an assumption about
        # a format none of them owns. The reader knows both shapes npm has
        # printed and exits 2 with one sentence when it is handed a third.
        run: |
          set -eu
          file="$(npm pack --json | node scripts/npm-pack-json.mjs)"
          test -f "$file"
          echo "tarball=$PWD/$file" >> "$GITHUB_OUTPUT"

      - name: Publish-hygiene gate on the tarball about to be published
        run: npm run check:tarball -- "${{ steps.pack.outputs.tarball }}"

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npm publish --provenance --access public "${{ steps.pack.outputs.tarball }}"

      # `npm publish` exiting 0 is not "published": the registry is asynchronous
      # and cached. This reads it, past both caches, until the version is served,
      # then asserts latest, provenance, repository.url = this repository, and the
      # tarball. A failure here means the release is NOT done: the image and
      # release-page jobs, which need this one, do not start either.
      - name: Verify the publish landed
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -eu
          node scripts/verify-published.mjs "$(node -p "require('./package.json').name")" \
            "$(node -p "require('./package.json').version")" "${GITHUB_REPOSITORY}" 300

      - name: Dry run only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --provenance --access public --dry-run "${{ steps.pack.outputs.tarball }}"

  # The image of the same tag, after npm: image.yml is DISPATCHED on the tag,
  # not called, so its cosign identity stays image.yml@refs/tags/vX.Y.Z, which
  # the deploy verifies. It runs its own gate (annotated tag, both versions, on
  # main, CI passed) and the server tests before it builds.
  image:
    name: Start the image (image.yml on the tag)
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # dispatches image.yml
    steps:
      - name: Dispatch image.yml on the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run image.yml --ref "$GITHUB_REF_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "image.yml dispatched on $GITHUB_REF_NAME: $GITHUB_SERVER_URL/$GH_REPO/actions/workflows/image.yml" | tee -a "$GITHUB_STEP_SUMMARY"

  # The release page once npm serves the version: release-please's draft for
  # the tag, filled from the CHANGELOG block and published.
  release-page:
    name: Release page
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-page.yml
    with:
      tag: ${{ github.ref_name }}
