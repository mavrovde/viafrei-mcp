name: Version sync

# The last link of the release chain, and the daily check of all of it
# (CONTRIBUTING.md, "How a release happens"):
#   release pull request -> merge -> tag (release-please.yml) -> Snyk, the
#   full mutation run, the e2e, npm, image, release page (publish.yml) ->
#   the deploy, outside this repository -> the live server serves the
#   version -> the MCP Registry and Smithery list it.
# The listings name the LIVE server, which serves a release only after the
# deploy, so they cannot follow npm directly (a run straight after npm always
# met the older server and refused: no listing from 2.7.6 to 2.7.10). This
# reads five facts - the live server's serverInfo.version, npm's latest and
# its versions, the tags, and the last successful run of each listing - and
# scripts/release-state.mjs decides: the newest tag stuck before npm (red,
# with the recovery), awaiting the deploy (green, nothing to do), or live,
# when it dispatches each listing that is behind. An older tag npm never
# served is reported as abandoned, never as stuck.
#
# One initialize per run against the live server and no tool call, which is a
# licence condition, not courtesy. No wait and no loop: a fact not there yet
# is read again the next day, or on a dispatch right after a deploy.
#
# The proposer that used to live here (a pull request mirroring a server that
# was ahead of the registry, merged, tagged and published by this workflow)
# is retired: the server is built from this repository, so its version comes
# from the release pull request (release-please.yml), never ahead of it.

on:
  schedule:
    # Once a day (owner 2026-11-15: GitHub by minimum), never in the same
    # minute as Freshness (06:00).
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: version-sync
  cancel-in-progress: false

env:
  MCP_URL: 'https://mcp.viafrei.de/mcp'

jobs:
  state:
    name: Where the newest release stands
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # reads the listings' runs, dispatches the ones behind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: The five facts
        id: facts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"viafrei-version-sync","version":"1"}}}'
          hdrs="$(mktemp)"
          out="$(curl -sS --max-time 20 -D "$hdrs" -X POST "$MCP_URL" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' --data "$body")"
          sid="$(grep -i '^mcp-session-id:' "$hdrs" | cut -d: -f2- | tr -d ' \r' || true)"
          if [ -n "$sid" ]; then
            curl -sS --max-time 10 -X DELETE "$MCP_URL" -H "mcp-session-id: $sid" -o /dev/null || true
          fi
          got="$(printf '%s' "$out" | sed -n 's/^data: //p' | head -1)"
          [ -n "$got" ] || got="$out"
          live="$(printf '%s' "$got" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).result.serverInfo.version))}catch{process.stdout.write("")}})')"
          name="$(node -p "require('./package.json').name")"
          npm view "$name" dist-tags.latest > "$RUNNER_TEMP/latest.txt"
          npm view "$name" versions --json > "$RUNNER_TEMP/versions.json"
          git tag -l 'v*' > "$RUNNER_TEMP/tags.txt"
          title() { gh run list --workflow "$1" --status success --limit 1 --json displayTitle --jq '.[0].displayTitle // ""'; }
          {
            echo "live=$live"
            echo "latest=$(tr -d '[:space:]' < "$RUNNER_TEMP/latest.txt")"
            echo "registry=$(title mcp-registry.yml)"
            echo "smithery=$(title smithery.yml)"
          } >> "$GITHUB_OUTPUT"

      # Red on stuck (with the recovery in the log), on a version above the
      # newest tag, and on an input it cannot read; green otherwise.
      - name: Judge the newest tag
        id: judge
        env:
          LIVE: ${{ steps.facts.outputs.live }}
          LATEST: ${{ steps.facts.outputs.latest }}
          REGISTRY: ${{ steps.facts.outputs.registry }}
          SMITHERY: ${{ steps.facts.outputs.smithery }}
        run: |
          set -o pipefail
          node scripts/release-state.mjs --live "$LIVE" --npm-latest "$LATEST" \
            --npm-versions "$RUNNER_TEMP/versions.json" --tags "$RUNNER_TEMP/tags.txt" \
            --registry "$REGISTRY" --smithery "$SMITHERY" | tee -a "$GITHUB_OUTPUT"

      - name: Dispatch the listings that are behind
        if: steps.judge.outputs.dispatch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DISPATCH: ${{ steps.judge.outputs.dispatch }}
          VERSION: ${{ steps.facts.outputs.live }}
        run: |
          set -eu
          for wf in $DISPATCH; do
            case "$wf" in mcp-registry.yml|smithery.yml) ;; *) echo "::error::not a listing workflow: $wf"; exit 2 ;; esac
            gh workflow run "$wf" --ref main -f version="$VERSION"
            echo "dispatched $wf for $VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
          done
